name: Build Desktop Apps (macOS & Linux)

on:
  push:
    branches: [ "main", "build" ]
  pull_request:
    branches: [ "main", "build" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Executable on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
            asset_name: stratum-linux
            stockfish_url: "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64.tar"
            icon_path: "static/images/gain_pawn.png"
            
          - os: macos-latest
            platform_name: macos
            asset_name: stratum-macos
            stockfish_url: "https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-macos-m1-apple-silicon.tar"
            icon_path: "static/images/icon.icns"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux System Dependencies
        if: matrix.platform_name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Setup Stockfish
        run: |
          mkdir -p engine/stockfish
          echo "Downloading Stockfish from ${{ matrix.stockfish_url }}..."
          curl -L "${{ matrix.stockfish_url }}" -o stockfish_archive.tar
          
          mkdir -p temp_sf
          tar -xvf stockfish_archive.tar -C temp_sf
          
          find temp_sf -maxdepth 2 -type f -name "stockfish*" -exec mv {} engine/stockfish/stockfish \;
          
          chmod +x engine/stockfish/stockfish
          
          rm -rf stockfish_archive.tar temp_sf
          
          echo "Stockfish binary successfully staged at engine/stockfish/stockfish"

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconsole --onefile \
            --icon "${{ matrix.icon_path }}" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "engine/stockfish/stockfish:engine/stockfish" \
            --name "${{ matrix.asset_name }}" \
            backend/app.py

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}*